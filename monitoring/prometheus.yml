# Run Prometheus in the WSL host network; both targets are host loopback.
global:
  scrape_interval: 15s
scrape_configs:
  - job_name: cloud-controller
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8080"]
  - job_name: litellm
    metrics_path: /metrics/
    static_configs:
      - targets: ["127.0.0.1:4001"]
