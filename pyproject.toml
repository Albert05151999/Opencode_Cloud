[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "opencode-cloud-development"
version = "0.3.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cryptography==45.0.6",
  "docker==7.2.0",
  "fastapi==0.116.2",
  "httpx==0.28.1",
  "sniffio==1.3.1",
  "prometheus-client==0.26.0",
  "python-multipart==0.0.32",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
test = [
  "pytest==8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["shared_libs*", "api_gateway*", "catalog_service*", "sandbox_manager*", "file_service*", "operations*", "observability*", "model_gateway*", "config.tooling*", "build_image*"]
